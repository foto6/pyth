name: DailyFocus Android CI

on:
  push:
    branches: [daily-focus-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore stable DailyFocus dev signing key
        shell: bash
        run: |
          set -euo pipefail
          echo "bcf74560ce3396e6a3a63df522dc001d0f83424530facb69b4f924584fdc8f6b  ci/dailyfocus-debug.keystore.b64" | sha256sum -c -
          mkdir -p "$HOME/.android"
          base64 -d ci/dailyfocus-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          echo "dbcf29b2e4da1babf61b6afdb1f0ed13d9941e7a8e84d4453db65ee7e70ad87f  $HOME/.android/debug.keystore" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Static verification
        run: python3 DailyFocus/tools/static_verify.py

      - name: Widget layout stress test
        run: python3 DailyFocus/tools/widget_layout_stress.py

      - name: Visual preview smoke test
        continue-on-error: true
        env:
          DAILYFOCUS_VISUAL_OUT: ${{ runner.temp }}/dailyfocus-visual
        run: python3 DailyFocus/tools/visual_smoke.py

      - name: Unit tests and debug APK
        working-directory: DailyFocus
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug --stacktrace

      - name: Re-sign APK with stable DailyFocus dev key
        shell: bash
        run: |
          set -euo pipefail
          APK="DailyFocus/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED="DailyFocus/app/build/outputs/apk/debug/app-debug-stable.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$APK"
          mv "$SIGNED" "$APK"

      - name: Verify APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="DailyFocus/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q "Signer #1 certificate SHA-256 digest: ad43a144090b6ce78cded9ccfcee256f3906c44d5e9effc8f969affc60f45fcc" apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.foto6.dailyfocus'" apk-badging.txt

      - name: Package exact tested source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='DailyFocus/.gradle' --exclude='DailyFocus/app/build' -czf DailyFocus-tested-source.tar.gz DailyFocus

      - name: Upload final APK, source and reports
        uses: actions/upload-artifact@v4
        with:
          name: DailyFocus-final
          if-no-files-found: error
          path: |
            DailyFocus/app/build/outputs/apk/debug/app-debug.apk
            DailyFocus/app/build/reports/tests/testDebugUnitTest/**
            DailyFocus-tested-source.tar.gz
            apk-badging.txt
            apk-signing.txt
