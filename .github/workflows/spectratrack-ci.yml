name: SpectraTrack CI

on:
  push:
    branches: [spectratrack-v1]
    paths:
      - 'SpectraTrack/**'
      - '.github/workflows/spectratrack-ci.yml'
  workflow_dispatch:

jobs:
  pc-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PC dependencies
        working-directory: SpectraTrack/pc
        run: |
          python -m pip install -U pip
          pip install -r requirements-win.txt
      - name: Compile and test PC client
        working-directory: SpectraTrack/pc
        run: |
          python -m compileall -q spectratrack tests
          pytest -q

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        working-directory: SpectraTrack/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpectraTrack-android-debug
          path: SpectraTrack/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
